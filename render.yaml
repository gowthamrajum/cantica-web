# Render Blueprint — static hosting for the Telugu Community Church site.
# Setup: Render dashboard → New → Blueprint → connect gowthamrajum/cantica-web.
# Served at the domain root, so BASE_PATH is left unset (base = "/").
services:
  - type: web
    name: cantica-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # SPA fallback: serve index.html for client-side routes
      # (/watch, /bible, /songs/:id, /c/:room …).
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Content-hashed assets (incl. the bundled Bible/Songs data-*.js) never change.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The files that decide whether an installed app notices a deploy.
      # They were inheriting s-maxage=300, so the CDN kept serving the old
      # service worker for five minutes and the app couldn't see a new build
      # even when it asked. They're tiny; let the edge revalidate every time.
      #
      # push-sw.js belongs here for the same reason and was missed: sw.js pulls
      # it in by importScripts at a stable, unhashed path, so a stale copy at
      # the edge means the worker keeps running the old notification code no
      # matter how many times the app updates itself.
      - path: /push-sw.js
        name: Cache-Control
        value: public, max-age=0, s-maxage=0, must-revalidate
      - path: /sw.js
        name: Cache-Control
        value: public, max-age=0, s-maxage=0, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, s-maxage=0, must-revalidate
      - path: /manifest.webmanifest
        name: Cache-Control
        value: public, max-age=0, s-maxage=0, must-revalidate
