<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Telugu Community Church">
  <!--
    The mark alone, on transparency. There is no tile behind it: a navy-900
    square reads as black at 16px and swallowed the logo whole.

    The mark's own artboard is 63.5 x 77.5 with its centre at (51.25, 51.25),
    so it is scaled to 0.8 — 62px tall inside a 64px box — and re-centred here.
    Height is the binding dimension; the width follows and leaves a margin.
  -->
  <defs>
    <linearGradient id="tccg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6aa8ea"/><stop offset="1" stop-color="#2f6bc4"/>
    </linearGradient>
  </defs>
  <g transform="translate(32 32) scale(0.8) translate(-51.25 -51.25)">
    <rect x="22.5" y="15.5" width="60" height="74" rx="5" fill="#d7e6f7"/>
    <rect x="20" y="13" width="60" height="74" rx="5" fill="url(#tccg)"/>
    <path d="M26 15.5 V84.5" stroke="#0e2440" stroke-width="1.6" opacity=".22" stroke-linecap="round"/>
    <path d="M47.25 18 H52.75 V35.25 H73 V40.75 H52.75 V84 H47.25 V40.75 H27 V35.25 H47.25 Z"
          fill="#f4f1e8" stroke="#2f6bc4" stroke-width="1" stroke-linejoin="round"/>
    <circle cx="50" cy="38" r="9" fill="#f4f1e8" stroke="#2f6bc4" stroke-width="1"/>
    <circle cx="50" cy="38" r="6.4" fill="none" stroke="#2f6bc4" stroke-width="1"/>
    <text x="50" y="38.6" text-anchor="middle" dominant-baseline="central" fill="#2f6bc4"
          font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="5.6"
          letter-spacing="0.06">TCC</text>
  </g>
</svg>
