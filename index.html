<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG first for anything that takes one; the PNGs are the fallback, and
         the sized list is what a tab strip actually picks from. Regenerate them
         with `npm run favicons` after touching favicon.svg — they are rendered
         from it, not drawn separately. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <!-- The home-screen icon is Cantica's flame, not the church mark. That is
         on purpose: this is the icon of an app, and it is not regenerated by
         the favicon script. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Matches the app's warm-paper chrome, so the Android status bar reads as
         part of the app bar rather than a navy strip above it. -->
    <meta name="theme-color" content="#faf6ee" />
    <meta name="description" content="Telugu Community Church, Irving TX — a warm, Christ-centered family. Join us for Sunday worship, Bible study, and prayer." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cantica" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Anek+Telugu:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <title>Telugu Community Church · Irving, TX</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
